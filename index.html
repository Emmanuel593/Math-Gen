<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGen Elite - Live AI Solver</title>
    <!-- MathLive for advanced mathematical rendering and symbol input -->
    <script src="https://unpkg.com/mathlive"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #1f2937;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* MathLive Field */
        math-field {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1.2rem;
            box-sizing: border-box;
        }

        math-field:focus-within {
            border-color: var(--accent);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            position: relative;
        }

        .upload-dropzone:hover {
            background-color: rgba(99, 102, 241, 0.05);
            border-color: var(--accent);
        }

        .upload-dropzone input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #374151;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .output-section {
            display: none;
        }

        .output-box {
            background-color: #1f2937;
            border-left: 4px solid var(--success);
            padding: 16px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 15px;
            font-size: 1.2rem;
            word-break: break-all;
        }

        .explanation-box {
            background-color: #1f2937;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.7;
            display: none;
            font-size: 1.05rem;
            white-space: pre-wrap;
        }

        .explanation-box h3 {
            margin-top: 0;
            color: #818cf8;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        /* Clean Print Formatting */
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            header, .card:not(.output-section), .btn-primary, .action-row { display: none !important; }
            .output-section { display: block !important; border: none !important; box-shadow: none !important; background: white !important; padding: 0 !important; margin: 0 !important; }
            .output-box { background: #f4f4f4 !important; color: black !important; border-left: 4px solid #10b981 !important; font-size: 1.1rem !important; }
            .explanation-box { background: #f9f9f9 !important; color: black !important; display: block !important; border: 1px solid #ddd !important; font-size: 1.1rem !important; }
            .explanation-box h3 { color: #111 !important; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MathGen Elite Suite</h1>
        <p>Your Ultimate Live AI Math Assistant</p>
    </header>

    <div class="card">
        <div class="control-group">
            <label for="apiKeyInput">Gemini API Key (Saved locally in your browser)</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here (AIzaSy...)" onchange="saveApiKey()">
        </div>

        <div class="control-group">
            <label for="gradeSelect">Select Grade Level</label>
            <select id="gradeSelect">
                <option value="Middle School Math">Middle School Math (Pre-Algebra)</option>
                <option value="Algebra 1" selected>Algebra 1</option>
                <option value="Geometry">Geometry</option>
                <option value="Algebra 2 / Word Problems">Algebra 2 / Word Problems</option>
                <option value="Pre-Calculus / Calculus">Pre-Calculus / Calculus</option>
            </select>
        </div>

        <div class="control-group">
            <label for="problemInput">Type or Paste Your Problem</label>
            <math-field id="problemInput" placeholder="Type equations, fractions, or paste problem text..."></math-field>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="showExplanation" checked>
            <label for="showExplanation" style="display:inline; margin:0; cursor:pointer;">Include full step-by-step detailed explanation</label>
        </div>

        <div class="control-group">
            <label>Or Upload Assignment / Problem Image</label>
            <div class="upload-dropzone">
                <span id="uploadText">Click or drag & drop an image of your assignment here</span>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="Assignment Preview">
            </div>
        </div>

        <button class="btn-primary" onclick="solveProblemAI()">Solve Problem with Live AI</button>
    </div>

    <div class="card output-section" id="outputSection">
        <h3 style="margin-top:0; color: var(--success);">Final Answer</h3>
        <div class="output-box" id="finalAnswerDisplay">Analyzing...</div>

        <div class="explanation-box" id="explanationCard">
            <h3>Step-by-Step Breakdown</h3>
            <div id="detailedExplanation">Analyzing...</div>
        </div>
        
        <div class="action-row">
            <button class="btn-secondary" onclick="speakExplanation()">🔊 Read Aloud</button>
            <button class="btn-secondary" style="background: #4f46e5;" onclick="window.print()">🖨️ Print Study Breakdown</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_math_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gemini_math_key', key);
    }

    let base64Image = null;
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result.split(',')[1];
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('uploadText').innerText = 'Image uploaded: ' + file.name;
            }
            reader.readAsDataURL(file);
        }
    }

    async function solveProblemAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const mathField = document.getElementById('problemInput');
        const problemText = mathField.getValue ? mathField.getValue('latex') : mathField.innerText.trim();
        const gradeLevel = document.getElementById('gradeSelect').value;
        const wantExplanation = document.getElementById('showExplanation').checked;

        if (!apiKey) {
            alert('Please enter your Gemini API key at the top to use the live solver.');
            return;
        }

        if (!problemText && !base64Image) {
            alert('Please enter a math expression or upload an image.');
            return;
        }

        document.getElementById('finalAnswerDisplay').innerText = "Solving live...";
        document.getElementById('detailedExplanation').innerText = "Thinking step-by-step...";
        document.getElementById('outputSection').style.display = 'block';
        document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

        const systemInstruction = `You are an elite ${gradeLevel} mathematics expert and tutor. Solve the provided math problem with absolute precision. 
        Crucial Rules:
        - Always provide exact mathematical answers in proper fraction or reduced radical form when applicable (e.g., fractional notation like \\frac{-3 \\pm \\sqrt{6}}{5}). Do not needlessly convert to decimals unless requested.
        - Structure your step-by-step explanation cleanly with numbered steps, clear line breaks, and explicit intermediate calculations so it reads like a professional textbook.
        - You must output your response strictly as a JSON object with two keys: "answer" and "explanation".`;

        const userPrompt = `Problem / Expression: ${problemText}`;

        let contentsArray = [{ text: userPrompt }];
        if (base64Image) {
            contentsArray.push({
                inline_data: {
                    mime_type: "image/jpeg",
                    data: base64Image
                }
            });
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: contentsArray }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error.message);
            }

            const rawJsonText = data.candidates[0].content.parts[0].text;
            const parsedResult = JSON.parse(rawJsonText);

            // Render exact answer using MathLive math element for visual fractions/radicals
            const ansDisplay = document.getElementById('finalAnswerDisplay');
            ansDisplay.innerHTML = `<math-field read-only>${parsedResult.answer}</math-field>`;
            
            const explanationCard = document.getElementById('explanationCard');
            if (wantExplanation) {
                document.getElementById('detailedExplanation').innerText = parsedResult.explanation;
                explanationCard.style.display = 'block';
            } else {
                explanationCard.style.display = 'none';
            }

        } catch (err) {
            document.getElementById('finalAnswerDisplay').innerText = "Error executing request.";
            document.getElementById('detailedExplanation').innerText = "Details: " + err.message;
            document.getElementById('explanationCard').style.display = 'block';
        }
    }

    function speakExplanation() {
        const textToSpeak = document.getElementById('detailedExplanation').innerText;
        if (!textToSpeak || textToSpeak.includes("Analyzing")) return;
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
