<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGen Elite - The Ultimate Anti-Confusion Vault</title>
    
    <!-- KaTeX for clean math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #1f2937;
            --success: #10b981;
            --cabinet-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea.math-textarea {
            width: 100%;
            min-height: 130px;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 1.1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
        }

        textarea.math-textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            position: relative;
        }

        .upload-dropzone:hover {
            background-color: rgba(99, 102, 241, 0.05);
            border-color: var(--accent);
        }

        .upload-dropzone input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            margin-top: 15px;
            display: none;
            text-align: center;
            color: var(--text-primary);
        }

        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
            margin: 0 auto;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #374151;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .output-section {
            display: none;
        }

        /* File Cabinet Style Layout */
        .cabinet-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--cabinet-gold);
            padding-bottom: 10px;
        }

        .cabinet-header h2 {
            margin: 0;
            color: var(--cabinet-gold);
            font-size: 1.5rem;
        }

        .cabinet-folder {
            background-color: #1f2937;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }

        .cabinet-folder:hover {
            border-color: var(--cabinet-gold);
        }

        .folder-tab {
            display: inline-block;
            background-color: var(--cabinet-gold);
            color: #0b0f19;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px 6px 0 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .folder-content {
            font-size: 1.05rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        /* Clean Print Formatting */
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            header, .card:not(.output-section), .btn-primary, .action-row { display: none !important; }
            .output-section { display: block !important; border: none !important; box-shadow: none !important; background: white !important; padding: 0 !important; margin: 0 !important; }
            .cabinet-folder { background: #f9f9f9 !important; border: 1px solid #ddd !important; color: black !important; }
            .folder-tab { background: #ddd !important; color: black !important; }
            .katex { color: black !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MathGen Elite Suite</h1>
        <p>Your Ultimate Anti-Confusion File Cabinet</p>
    </header>

    <div class="card">
        <div class="control-group">
            <label for="apiKeyInput">Gemini API Key (Saved locally in your browser)</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here (AIzaSy...)" onchange="saveApiKey()">
        </div>

        <div class="control-group">
            <label for="gradeSelect">Select Grade Level</label>
            <select id="gradeSelect">
                <option value="Middle School Math">Middle School Math (Pre-Algebra)</option>
                <option value="Algebra 1" selected>Algebra 1</option>
                <option value="Geometry">Geometry</option>
                <option value="Algebra 2 / Word Problems">Algebra 2 / Word Problems</option>
                <option value="Pre-Calculus / Calculus">Pre-Calculus / Calculus</option>
            </select>
        </div>

        <div class="control-group">
            <label for="problemInput">Paste Your Confusing Homework, Test List, or Problem Set</label>
            <textarea id="problemInput" class="math-textarea" placeholder="Paste your massive problem list or single confusing problem here... We will organize it into happy little folders."></textarea>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="includeExplanation" checked>
            <label for="includeExplanation" style="display:inline; margin:0; cursor:pointer;">Include full step-by-step detailed explanation</label>
        </div>

        <div class="control-group">
            <label>Upload Assignment PDF or Image</label>
            <div class="upload-dropzone">
                <span id="uploadText">Click or drag & drop a PDF worksheet or image here</span>
                <input type="file" id="fileInput" accept="image/*,application/pdf" onchange="handleFileUpload(event)">
            </div>
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="Assignment Preview">
                <span id="fileLoadStatus"></span>
            </div>
        </div>

        <button class="btn-primary" onclick="solveProblemAI()">📂 Open The Happy File Cabinet</button>
    </div>

    <div class="card output-section" id="outputSection">
        <div class="cabinet-header">
            <h2>📁 The Answer Cabinet</h2>
        </div>
        
        <div id="cabinetFoldersContainer">
            <!-- Dynamic Folders Inserted Here -->
        </div>
        
        <div class="action-row">
            <button class="btn-secondary" onclick="speakCabinet()">🔊 Read Cabinet Out Loud</button>
            <button class="btn-secondary" style="background: #4f46e5;" onclick="window.print()">🖨️ Print Entire Cabinet</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_math_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }

        document.getElementById('problemInput').addEventListener('paste', function (e) {
            e.preventDefault();
            const text = (e.originalEvent || e).clipboardData.getData('text/plain');
            const cleanText = text.replace(/[\u200B-\u200D\uFEFF]/g, '');
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + cleanText + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + cleanText.length;
        });
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gemini_math_key', key);
    }

    let uploadedFilePayload = null;
    let uploadedFileType = 'image/jpeg';

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (file) {
            uploadedFileType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFilePayload = e.target.result.split(',')[1];
                document.getElementById('previewContainer').style.display = 'block';
                
                if (file.type === 'application/pdf') {
                    document.getElementById('imagePreview').style.display = 'none';
                    document.getElementById('fileLoadStatus').innerText = 'PDF Attached: ' + file.name;
                } else {
                    const img = document.getElementById('imagePreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('fileLoadStatus').innerText = 'Image Attached: ' + file.name;
                }
                document.getElementById('uploadText').innerText = 'File loaded successfully!';
            }
            reader.readAsDataURL(file);
        }
    }

    function renderMathOnScreen() {
        if (window.renderMathInElement) {
            window.renderMathInElement(document.getElementById('outputSection'), {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
        }
    }

    async function solveProblemAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const problemText = document.getElementById('problemInput').value.trim();
        const gradeLevel = document.getElementById('gradeSelect').value;
        const wantExplanation = document.getElementById('includeExplanation').checked;

        if (!apiKey) {
            alert('Please enter your Gemini API key at the top to use the live solver.');
            return;
        }

        if (!problemText && !uploadedFilePayload) {
            alert('Please enter a math expression, paste text, or upload a PDF/image.');
            return;
        }

        document.getElementById('cabinetFoldersContainer').innerHTML = "<div class='cabinet-folder'><div class='folder-tab'>Status</div><div class='folder-content'>Opening filing cabinet... organizing everything into crystal clear folders...</div></div>";
        document.getElementById('outputSection').style.display = 'block';
        document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

        const systemInstruction = `You are an expert ${gradeLevel} math tutor helping a student who gets overwhelmed easily. 
        CRITICAL FORMATTING INSTRUCTIONS:
        - Analyze the user's input (it could be a single problem or a list of numbered problems).
        - For EVERY individual problem, create a separate cabinet folder.
        - Folder title format must strictly be: "Problem 1", "Problem 2", "Problem 3", etc.
        - If the user wants explanations (${wantExplanation}), provide a very deep, rich, comprehensive, dummy-proof plain-English breakdown of every single step in detail so they fully understand how the math works. If explanation is turned off, provide just the clean final answer.
        - Respond strictly as a valid JSON object containing an array called "folders", where each object in the array has two keys: "title" (e.g. "Problem 1") and "summary" (containing the answer and the detailed explanation if enabled).`;

        const userProblem = `Problem / Expression / Text List: ${problemText}`;

        let contentsArray = [{ text: userProblem }];
        if (uploadedFilePayload) {
            contentsArray.push({
                inline_data: {
                    mime_type: uploadedFileType,
                    data: uploadedFilePayload
                }
            });
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: contentsArray }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error.message);
            }

            const rawJsonText = data.candidates[0].content.parts[0].text;
            const parsedResult = JSON.parse(rawJsonText);

            let foldersHTML = "";
            if (parsedResult.folders && Array.isArray(parsedResult.folders)) {
                parsedResult.folders.forEach((folder, index) => {
                    foldersHTML += `
                        <div class="cabinet-folder">
                            <div class="folder-tab">${folder.title || 'Problem ' + (index + 1)}</div>
                            <div class="folder-content">${folder.summary}</div>
                        </div>
                    `;
                });
            } else {
                foldersHTML = `<div class="cabinet-folder"><div class='folder-tab'>Result</div><div class='folder-content'>${JSON.stringify(parsedResult)}</div></div>`;
            }

            document.getElementById('cabinetFoldersContainer').innerHTML = foldersHTML;
            setTimeout(renderMathOnScreen, 50);

        } catch (err) {
            document.getElementById('cabinetFoldersContainer').innerHTML = `
                <div class="cabinet-folder" style="border-color: #ef4444;">
                    <div class="folder-tab" style="background-color: #ef4444;">Error</div>
                    <div class="folder-content">Details: ${err.message}</div>
                </div>`;
        }
    }

    function speakCabinet() {
        const contentContainers = document.querySelectorAll('.folder-content');
        let fullText = "";
        contentContainers.forEach(el => { fullText += el.innerText + ". "; });
        
        if (!fullText || fullText.includes("Opening filing cabinet")) return;
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
