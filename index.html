<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGen Elite - The Ultimate Anti-Confusion Vault</title>
    
    <!-- KaTeX for clean math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #1f2937;
            --success: #10b981;
            --cabinet-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        header h1 {
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 6s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header p {
            color: var(--text-secondary);
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        textarea.math-textarea {
            width: 100%;
            min-height: 130px;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 1.1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea.math-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            position: relative;
        }

        .upload-dropzone:hover {
            background-color: rgba(59, 130, 246, 0.05);
            border-color: var(--accent);
            transform: scale(1.01);
        }

        .upload-dropzone input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            margin-top: 15px;
            display: none;
            text-align: center;
            color: var(--text-primary);
        }

        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
            margin: 0 auto;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.6);
        }

        .btn-secondary {
            background-color: #374151;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
            transform: translateY(-1px);
        }

        .output-section {
            display: none;
        }

        /* File Cabinet Style Layout with Cool Guy Colors (Blue/Cyan/Teal/Indigo) */
        .cabinet-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--cabinet-gold);
            padding-bottom: 10px;
        }

        .cabinet-header h2 {
            margin: 0;
            color: var(--cabinet-gold);
            font-size: 1.6rem;
        }

        .print-only-title {
            display: none;
        }

        .cabinet-folder {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            border: 2px solid #374151;
            border-left: 6px solid #3b82f6;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            animation: folderPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .cabinet-folder:nth-child(2) { border-left-color: #0ea5e9; animation-delay: 0.1s; }
        .cabinet-folder:nth-child(3) { border-left-color: #2563eb; animation-delay: 0.2s; }
        .cabinet-folder:nth-child(4) { border-left-color: #06b6d4; animation-delay: 0.3s; }
        .cabinet-folder:nth-child(5) { border-left-color: #1d4ed8; animation-delay: 0.4s; }
        .cabinet-folder:nth-child(n+6) { border-left-color: #6366f1; animation-delay: 0.5s; }

        @keyframes folderPop {
            to { opacity: 1; transform: translateY(0); }
        }

        .folder-tab {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px 8px 0 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .problem-badge {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(14, 165, 233, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 16px;
            font-size: 1.2rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .folder-content {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-primary);
        }

        .final-answer-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2));
            border: 2px solid #10b981;
            padding: 16px;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 1.25rem;
            font-weight: 800;
            color: #34d399;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        /* Clean Color Print Formatting */
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            header, .card:not(.output-section), .btn-primary, .action-row, .cabinet-header { display: none !important; }
            .output-section { display: block !important; border: none !important; box-shadow: none !important; background: white !important; padding: 0 !important; margin: 0 !important; }
            
            .print-only-title {
                display: block !important;
                text-align: center;
                border-bottom: 3px solid #2563eb;
                padding-bottom: 12px;
                margin-bottom: 25px;
            }
            .print-only-title h1 {
                margin: 0;
                font-size: 1.8rem;
                color: #1e293b;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .print-only-title p {
                margin: 5px 0 0 0;
                color: #64748b;
                font-size: 0.95rem;
            }

            .cabinet-folder { background: #ffffff !important; border: 2px solid #cbd5e1 !important; border-left: 6px solid #2563eb !important; color: black !important; box-shadow: none !important; margin-bottom: 25px !important; page-break-inside: avoid !important; break-inside: avoid !important; }
            .folder-tab { background: #2563eb !important; color: white !important; box-shadow: none !important; }
            .problem-badge { background-color: #f8fafc !important; border: 1px solid #cbd5e1 !important; color: #0f172a !important; box-shadow: none !important; }
            .final-answer-box { background-color: #ecfdf5 !important; border: 2px solid #059669 !important; color: #047857 !important; box-shadow: none !important; }
            .folder-content { color: black !important; }
            .katex { color: black !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MathGen Elite Suite</h1>
        <p>Your Ultimate Anti-Confusion File Cabinet</p>
    </header>

    <div class="card">
        <div class="control-group">
            <label for="apiKeyInput">Gemini API Key (Saved locally in your browser)</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here (AIzaSy...)" onchange="saveApiKey()">
        </div>

        <div class="control-group">
            <label for="problemInput">Paste Your Confusing Homework, Test List, or Problem Set</label>
            <textarea id="problemInput" class="math-textarea" placeholder="Paste anything here: weird characters, messy web symbols, math equations, or full lists. All hidden artifacts are auto-stripped."></textarea>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="includeExplanation" checked>
            <label for="includeExplanation" style="display:inline; margin:0; cursor:pointer;">Include full step-by-step detailed explanation (Maximum Clarity Mode)</label>
        </div>

        <div class="control-group">
            <label>Upload Assignment PDF or Image</label>
            <div class="upload-dropzone">
                <span id="uploadText">Click or drag & drop a PDF worksheet or image here</span>
                <input type="file" id="fileInput" accept="image/*,application/pdf" onchange="handleFileUpload(event)">
            </div>
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="Assignment Preview">
                <span id="fileLoadStatus"></span>
            </div>
        </div>

        <button class="btn-primary" onclick="solveProblemAI()">📂 Open The Answer Cabinet</button>
    </div>

    <div class="card output-section" id="outputSection">
        <div class="cabinet-header">
            <h2>📁 The Answer Cabinet</h2>
        </div>

        <div class="print-only-title">
            <h1>Master Study Reference Sheet</h1>
            <p>Verified Step-by-Step Problem Breakdown & Solutions</p>
        </div>
        
        <div id="cabinetFoldersContainer">
            <!-- Dynamic Folders Inserted Here -->
        </div>
        
        <div class="action-row">
            <button class="btn-secondary" style="background: #2563eb;" onclick="window.print()">🖨️ Print Entire Cabinet in Color</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_math_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }

        document.getElementById('problemInput').addEventListener('paste', function (e) {
            e.preventDefault();
            const clipboardData = e.clipboardData || window.clipboardData;
            const text = clipboardData.getData('text/plain');
            
            const cleanText = text
                .replace(/[\u200B-\u200D\uFEFF]/g, '')
                .replace(/\u00A0/g, ' ')
                .replace(/\r\n/g, '\n');

            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + cleanText + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + cleanText.length;
        });
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gemini_math_key', key);
    }

    let uploadedFilePayload = null;
    let uploadedFileType = 'image/jpeg';

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (file) {
            uploadedFileType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFilePayload = e.target.result.split(',')[1];
                document.getElementById('previewContainer').style.display = 'block';
                
                if (file.type === 'application/pdf') {
                    document.getElementById('imagePreview').style.display = 'none';
                    document.getElementById('fileLoadStatus').innerText = 'PDF Attached: ' + file.name;
                } else {
                    const img = document.getElementById('imagePreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('fileLoadStatus').innerText = 'Image Attached: ' + file.name;
                }
                document.getElementById('uploadText').innerText = 'File loaded successfully!';
            }
            reader.readAsDataURL(file);
        }
    }

    function renderMathOnScreen() {
        if (window.renderMathInElement) {
            window.renderMathInElement(document.getElementById('outputSection'), {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
        }
    }

    async function solveProblemAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const problemText = document.getElementById('problemInput').value.trim();
        const wantExplanation = document.getElementById('includeExplanation').checked;

        if (!apiKey) {
            alert('Please enter your Gemini API key at the top to use the live solver.');
            return;
        }

        if (!problemText && !uploadedFilePayload) {
            alert('Please enter a math expression, paste text, or upload a PDF/image.');
            return;
        }

        document.getElementById('cabinetFoldersContainer').innerHTML = "<div class='cabinet-folder'><div class='folder-tab'>Status</div><div class='folder-content'>Opening filing cabinet... organizing everything into vibrant colored folders...</div></div>";
        document.getElementById('outputSection').style.display = 'block';
        document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

        const instructionMode = wantExplanation 
            ? "Provide a crystal-clear, zero-BS, ultra-fluent breakdown written like a real human explaining it directly to a friend. Walk through every single calculation clearly step by step. Then, put the final answer in a dedicated bold section at the absolute bottom." 
            : "Provide ONLY the clean final answer. Do NOT include any explanations or extra text.";

        const systemInstruction = `You are an elite mathematics tutor helping a student organize problems into a physical filing cabinet.
        CRITICAL INSTRUCTIONS:
        - Analyze the user's input (a single problem or list of numbered problems).
        - For EVERY individual problem, create a separate cabinet folder.
        - Folder title format must strictly be: "Problem 1", "Problem 2", "Problem 3", etc.
        - You MUST include the original problem statement or expression clearly at the top.
        - NEVER use markdown hash symbols (#) for headers or text styling. Use clean paragraphs and line breaks instead.
        - Mode requested: ${instructionMode}
        - Handle any fractions, radicals, or symbols accurately using LaTeX inside dollar signs.
        - Respond strictly as a valid JSON object containing an array called "folders", where each object in the array has three keys: "title" (e.g. "Problem 1"), "problem" (the original expression/question), and "summary" (containing the breakdown and the final answer box at the bottom).`;

        const userProblem = `Problem / Expression / Text List: ${problemText}`;

        let contentsArray = [{ text: userProblem }];
        if (uploadedFilePayload) {
            contentsArray.push({
                inline_data: {
                    mime_type: uploadedFileType,
                    data: uploadedFilePayload
                }
            });
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: contentsArray }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error.message);
            }

            const rawJsonText = data.candidates[0].content.parts[0].text;
            const parsedResult = JSON.parse(rawJsonText);

            let foldersHTML = "";
            if (parsedResult.folders && Array.isArray(parsedResult.folders)) {
                parsedResult.folders.forEach((folder, index) => {
                    const probTitle = folder.title || 'Problem ' + (index + 1);
                    const origProblem = folder.problem || 'Expression not provided';
                    let folderSummary = folder.summary || '';

                    folderSummary = folderSummary.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                    foldersHTML += `
                        <div class="cabinet-folder">
                            <div class="folder-tab">${probTitle}</div>
                            <div class="problem-badge">📌 Problem: ${origProblem}</div>
                            <div class="folder-content">${folderSummary}</div>
                        </div>
                    `;
                });
            } else {
                foldersHTML = `<div class="cabinet-folder"><div class='folder-tab'>Result</div><div class='folder-content'>${JSON.stringify(parsedResult)}</div></div>`;
            }

            document.getElementById('cabinetFoldersContainer').innerHTML = foldersHTML;
            setTimeout(renderMathOnScreen, 50);

        } catch (err) {
            document.getElementById('cabinetFoldersContainer').innerHTML = `
                <div class="cabinet-folder" style="border-color: #ef4444;">
                    <div class="folder-tab" style="background-color: #ef4444;">Error</div>
                    <div class="folder-content">Details: ${err.message}</div>
                </div>`;
        }
    }
</script>

</body>
</html>
